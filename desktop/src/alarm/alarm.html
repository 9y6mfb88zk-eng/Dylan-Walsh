<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file: blob:; connect-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>JARVIS — Alarm</title>
<style>
  html, body { margin: 0; height: 100%; background: #01040a; color: #e3f3ff; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, rgba(0, 229, 255, .22), rgba(1, 4, 10, .98) 62%); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { background-color: #031427; } }
  main { text-align: center; padding: 24px; }
  .ring { width: 220px; height: 220px; margin: 0 auto 22px; border-radius: 50%; border: 2px solid rgba(103, 232, 249, .6); box-shadow: 0 0 60px rgba(0, 229, 255, .45), inset 0 0 50px rgba(0, 229, 255, .35); display: grid; place-items: center; animation: beat 1s ease-in-out infinite; }
  .ring::after { content: ""; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff, #67e8f9 40%, rgba(34, 211, 238, .15) 70%); box-shadow: 0 0 60px #00e5ff; }
  @keyframes beat { 50% { transform: scale(1.06); box-shadow: 0 0 90px rgba(0, 229, 255, .7), inset 0 0 60px rgba(0, 229, 255, .5); } }
  .t { font: 600 clamp(80px, 16vw, 170px)/1 "Cascadia Mono", Consolas, monospace; color: #fff; text-shadow: 0 0 40px rgba(0, 229, 255, .8); }
  .l { font-weight: 600; font-size: 26px; letter-spacing: .3em; text-transform: uppercase; color: #67e8f9; margin: 12px 0 6px; }
  .m { color: #9fb8cc; min-height: 1.5em; max-width: 760px; margin: 0 auto 34px; font-size: 18px; }
  .acts { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  button { font: 600 22px "Segoe UI", sans-serif; padding: 20px 46px; border-radius: 18px; cursor: pointer; color: #cdeffd; background: rgba(14, 40, 70, .8); border: 1px solid rgba(103, 205, 255, .5); }
  button:hover, button:focus-visible { outline: none; box-shadow: 0 0 28px rgba(0, 229, 255, .5); }
  button.primary { color: #001421; background: linear-gradient(180deg, #67e8f9, #22b8d8); border-color: #cdeffd; }
  .hint { margin-top: 26px; font-size: 13px; color: #60778f; }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>
  <div class="t" id="time">--:--</div>
  <div class="l" id="label">Alarm</div>
  <p class="m" id="msg"></p>
  <div class="acts"><button id="snooze">Snooze</button><button class="primary" id="dismiss">Dismiss</button></div>
  <p class="hint" id="hint">S = snooze · Esc or D = dismiss</p>
</main>
<script src="alarm.js"></script>
</body>
</html>
