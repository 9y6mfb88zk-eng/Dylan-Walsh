<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Connect JARVIS</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 0%, #1b0b33, #06030c 60%); color: #f1ecff; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { width: 420px; max-width: calc(100% - 32px); padding: 28px; border-radius: 20px; background: rgba(255,255,255,.06); border: 1px solid rgba(196,181,253,.2); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .orb { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 10px; background: radial-gradient(circle at 35% 30%, #fff, #a78bfa 40%, #4c1d95); box-shadow: 0 0 40px rgba(139,92,246,.7); }
  h1 { text-align: center; letter-spacing: .35em; font-size: 16px; color: #c4b5fd; margin: 0 0 6px; }
  p { color: rgba(226,216,255,.65); font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid rgba(196,181,253,.3); background: rgba(255,255,255,.06); color: inherit; font-size: 15px; }
  button { width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid rgba(196,181,253,.45); background: linear-gradient(160deg, rgba(167,139,250,.55), rgba(124,58,237,.45)); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .err { color: #fca5a5; min-height: 1.4em; font-size: 14px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="orb"></div>
    <h1>JARVIS</h1>
    <p>Enter the web address of your JARVIS server (the one you deployed, e.g. <b>https://jarvis-xxxx.onrender.com</b>). You'll sign in on the next screen.</p>
    <input id="url" placeholder="https://your-jarvis-server" autofocus required>
    <button id="go">Connect</button>
    <p class="err" id="err"></p>
  </form>
  <script src="setup.js"></script>
</body>
</html>
