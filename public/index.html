<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <meta name="theme-color" content="#06030c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <div class="gridlines" aria-hidden="true"></div>

  <!-- Sign-in / setup / pairing -->
  <section id="auth" class="auth" hidden>
    <div class="glass auth-card">
      <canvas class="auth-core" id="authCore" aria-hidden="true"></canvas>
      <h1 id="authTitle">JARVIS</h1>
      <p class="muted" id="authLead">Secure sign-in</p>
      <form id="authForm" class="stack" autocomplete="on">
        <label class="field" id="codeField" hidden><span>Setup code</span><input id="authCode" autocomplete="one-time-code" placeholder="From the server log or JARVIS_SETUP_TOKEN"></label>
        <label class="field" id="pairField" hidden><span>Pairing code</span><input id="authPair" placeholder="ABCD-1234" autocapitalize="characters"></label>
        <label class="field" id="pwField"><span>Password</span><input id="authPw" type="password" autocomplete="current-password" minlength="10"></label>
        <label class="field" id="pw2Field" hidden><span>Confirm password</span><input id="authPw2" type="password" autocomplete="new-password"></label>
        <label class="field"><span>Name this device</span><input id="authDevice" placeholder="e.g. Dylan's iPhone"></label>
        <button class="btn primary" id="authSubmit">Sign in</button>
        <p class="error" id="authErr" role="alert"></p>
      </form>
      <div class="auth-switch"><button class="link" id="authPairToggle">Pair with a code instead</button></div>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <nav class="rail glass" id="rail" aria-label="Sections"></nav>

    <main class="main">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span>J·A·R·V·I·S</div>
        <div class="chips" id="chips"></div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <div id="view" class="view"></div>
    </main>

    <nav class="dock glass" id="dock" aria-label="Sections"></nav>
  </div>

  <!-- Persistent voice HUD (visible on every screen) -->
  <div id="hud" class="hud glass" hidden>
    <canvas id="hudCore" class="hud-core"></canvas>
    <div class="hud-text"><b id="hudState">Listening</b><span id="hudCaption"></span></div>
    <button class="btn ghost small" id="hudStop">Stop</button>
  </div>

  <div class="toast glass" id="toast" role="status"></div>
  <dialog id="modal" class="modal glass"></dialog>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
